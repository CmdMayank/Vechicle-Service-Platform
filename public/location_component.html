<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Location Input Component — RoadRescue</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Leaflet Map CSS for Map Selector Option -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* Design Tokens */
    :root {
      --dark: #080C14;
      --card-bg: #101622;
      --border: #1B2536;
      --amber: #FF6B35;
      --amber-hover: #FF8557;
      --amber-glow: rgba(255, 107, 53, 0.2);
      --text: #F0F4FF;
      --muted: #7B8BA5;
      --red: #FF3B5C;
      --success: #00FF66;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--dark);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Card Wrapper */
    .component-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .component-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .component-desc {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    /* Input Container Styles */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .input-container {
      position: relative;
      display: flex;
      align-items: center;
    }

    .location-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 16px 160px 16px 16px; /* Spaced to fit action buttons nicely */
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .location-input:focus {
      outline: none;
      border-color: var(--amber);
      box-shadow: 0 0 0 4px var(--amber-glow);
      background: rgba(0, 0, 0, 0.6);
    }

    /* Embedded Action Buttons */
    .actions-wrapper {
      position: absolute;
      right: 6px;
      display: flex;
      gap: 6px;
      height: calc(100% - 12px);
    }

    .action-btn {
      background: rgba(255, 107, 53, 0.1);
      border: 1px solid var(--amber);
      color: var(--amber);
      border-radius: 8px;
      padding: 0 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s ease;
      user-select: none;
    }

    .action-btn:hover:not(:disabled) {
      background: var(--amber);
      color: var(--dark);
    }

    .action-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* Map Active state */
    .action-btn.map-active {
      background: var(--amber);
      color: var(--dark);
    }

    /* Spinner style */
    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255, 107, 53, 0.2);
      border-radius: 50%;
      border-top-color: var(--amber);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Error Message */
    .error-msg {
      color: var(--red);
      font-size: 0.85rem;
      font-weight: 500;
      margin-top: 6px;
      display: none;
      align-items: center;
      gap: 4px;
    }

    /* Map Container */
    .map-container {
      width: 100%;
      height: 200px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-top: 12px;
      overflow: hidden;
      display: none;
    }

    /* Map overrides for Leaflet dark mode theme */
    .leaflet-container {
      background: var(--dark) !important;
    }

    .leaflet-bar {
      border: 1px solid var(--border) !important;
      box-shadow: none !important;
    }

    .leaflet-bar a {
      background-color: var(--card-bg) !important;
      color: var(--text) !important;
      border-bottom: 1px solid var(--border) !important;
    }

    .leaflet-bar a:hover {
      background-color: var(--amber) !important;
      color: var(--dark) !important;
    }

    .leaflet-control-attribution {
      background: rgba(8, 12, 20, 0.8) !important;
      color: var(--muted) !important;
      font-size: 0.65rem !important;
    }

    .leaflet-control-attribution a {
      color: var(--amber) !important;
    }

    .map-help-text {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 5px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="component-card">
    <h3 class="component-title">Location Component</h3>
    <p class="component-desc">Click "Auto" to detect your location via GPS, or open the map to pin it manually.</p>

    <div class="form-group">
      <label class="form-label">Breakdown Location</label>
      <div class="input-container">
        <input 
          type="text" 
          id="locationInput" 
          class="location-input" 
          placeholder="Enter address or landmark..." 
          autocomplete="off"
        />
        <div class="actions-wrapper">
          <button type="button" id="autoBtn" class="action-btn">
            <span id="btnIcon">📍</span>
            <span id="btnText">Auto</span>
          </button>
          <button type="button" id="mapBtn" class="action-btn">🗺️ Map</button>
        </div>
      </div>

      <!-- Error State Element -->
      <div id="errorEl" class="error-msg"></div>

      <!-- Map Selector Element -->
      <div id="mapEl" class="map-container"></div>
      <div id="mapHelpEl" class="map-help-text">🖱️ Click anywhere on the map to place a pin and reverse-geocode your address.</div>
    </div>
  </div>

  <!-- Leaflet Javascript Library -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Elements Selectors
    const locationInput = document.getElementById('locationInput');
    const autoBtn = document.getElementById('autoBtn');
    const btnIcon = document.getElementById('btnIcon');
    const btnText = document.getElementById('btnText');
    const mapBtn = document.getElementById('mapBtn');
    const errorEl = document.getElementById('errorEl');
    const mapEl = document.getElementById('mapEl');
    const mapHelpEl = document.getElementById('mapHelpEl');

    let map = null;
    let marker = null;
    let mapInitialized = false;

    // Helper: Reset button to standard state
    function resetAutoButton() {
      autoBtn.removeAttribute('disabled');
      btnIcon.innerHTML = '📍';
      btnIcon.className = '';
      btnText.textContent = 'Auto';
    }

    // Helper: Set button to loading spinner state
    function setLoadingState() {
      autoBtn.setAttribute('disabled', 'true');
      btnIcon.innerHTML = '';
      btnIcon.className = 'spinner';
      btnText.textContent = 'GPS...';
      hideError();
    }

    // Helper: Show Error Alert
    function showError(message) {
      errorEl.textContent = `⚠️ ${message}`;
      errorEl.style.display = 'flex';
    }

    // Helper: Hide Error Alert
    function hideError() {
      errorEl.style.display = 'none';
      errorEl.textContent = '';
    }

    // Helper: Smooth Typewriter Effect for input fields
    function typewriteText(text) {
      let index = 0;
      locationInput.value = '';
      const interval = setInterval(() => {
        if (index < text.length) {
          locationInput.value += text[index];
          index++;
        } else {
          clearInterval(interval);
        }
      }, 15);
    }

    // Geocoder: Reverse Geocode via Nominatim API
    async function reverseGeocode(lat, lon) {
      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`, {
          headers: { 'Accept-Language': 'en' }
        });
        if (!response.ok) throw new Error('Geocoding service unavailable');
        
        const data = await response.json();
        if (data && data.display_name) {
          const addressParts = data.display_name.split(',');
          // Shorten the address to first 3 details for better mobile visibility
          const cleanAddress = addressParts.slice(0, 3).join(',').trim();
          typewriteText(`${cleanAddress} (${lat.toFixed(4)}, ${lon.toFixed(4)})`);
        } else {
          typewriteText(`Coordinates: ${lat.toFixed(6)}, ${lon.toFixed(6)}`);
        }
      } catch (err) {
        console.error(err);
        typewriteText(`Coordinates: ${lat.toFixed(6)}, ${lon.toFixed(6)}`);
      }
    }

    // GPS Geolocation Handler
    autoBtn.addEventListener('click', () => {
      setLoadingState();

      if (!navigator.geolocation) {
        showError('GPS is not supported by your browser.');
        resetAutoButton();
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          // Resolve Address
          reverseGeocode(lat, lon);

          // Update Map view if open
          if (map) {
            map.setView([lat, lon], 15);
            if (marker) {
              marker.setLatLng([lat, lon]);
            }
          }

          resetAutoButton();
        },
        (error) => {
          let message = 'GPS Timeout. Please enter address manually.';
          if (error.code === error.PERMISSION_DENIED) {
            message = 'Location access denied. Please type manually.';
          } else if (error.code === error.POSITION_UNAVAILABLE) {
            message = 'GPS signal unavailable. Please type manually.';
          }
          
          showError(message);
          resetAutoButton();
        },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    });

    // Toggle Leaflet Map Selector Panel
    mapBtn.addEventListener('click', () => {
      const isVisible = mapEl.style.display === 'block';

      if (isVisible) {
        mapEl.style.display = 'none';
        mapHelpEl.style.display = 'none';
        mapBtn.classList.remove('map-active');
      } else {
        mapEl.style.display = 'block';
        mapHelpEl.style.display = 'block';
        mapBtn.classList.add('map-active');

        // Lazy initialize map
        if (!mapInitialized) {
          mapInitialized = true;
          // Standard default position
          const defaultPos = [37.7749, -122.4194];

          // Create leaflet map instance
          map = L.map('mapEl', { zoomControl: true }).setView(defaultPos, 13);

          // Dark Map Layer tiles
          L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap &copy; CARTO'
          }).addTo(map);

          // Custom Marker Icon matching --amber
          const customIcon = L.divIcon({
            className: 'custom-map-marker',
            html: `<div style="
              width: 20px;
              height: 20px;
              background: var(--amber);
              border: 3px solid #FFF;
              border-radius: 50% 50% 50% 0;
              transform: rotate(-45deg);
              box-shadow: 0 0 10px var(--amber);
              position: relative;
            ">
              <div style="width:6px; height:6px; background:#FFF; border-radius:50%; position:absolute; top:4px; left:4px;"></div>
            </div>`,
            iconSize: [20, 20],
            iconAnchor: [10, 20]
          });

          // Pin marker
          marker = L.marker(defaultPos, { icon: customIcon, draggable: true }).addTo(map);

          // Map Click Interaction
          map.on('click', (e) => {
            const { lat, lng } = e.latlng;
            marker.setLatLng([lat, lng]);
            reverseGeocode(lat, lng);
          });

          // Marker Drag Interaction
          marker.on('dragend', () => {
            const { lat, lng } = marker.getLatLng();
            reverseGeocode(lat, lng);
          });

          // Try loading user default position immediately onto the map selector
          if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
              (pos) => {
                const userLat = pos.coords.latitude;
                const userLon = pos.coords.longitude;
                map.setView([userLat, userLon], 14);
                marker.setLatLng([userLat, userLon]);
                reverseGeocode(userLat, userLon);
              },
              () => {},
              { timeout: 3000 }
            );
          }
        } else {
          // Invalidate size to ensure Leaflet renders correctly after display block
          setTimeout(() => {
            map.invalidateSize();
          }, 100);
        }
      }
    });
  </script>
</body>
</html>
